name: Daily Econ

on:
  schedule:
    # 평일 KST 22:05 ~ 05:05, 30분 간격 (UTC 13:05~19:35, 20:05)
    - cron: "5,35 13-19 * * 1-6"
    - cron: "5 20 * * 1-5"
  workflow_dispatch:         # Actions 탭에서 수동 실행(테스트용)

permissions:
  contents: write

jobs:
  econ:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Fetch & notify
        run: python markets.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if ! git diff --staged --quiet; then
            git commit -m "econ $(TZ=Asia/Seoul date +%F)"
            git pull --rebase
            git push
          fi
